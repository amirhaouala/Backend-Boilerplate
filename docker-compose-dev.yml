version: "3.9"
services:
  back-dev:
    container_name: back_dev
    depends_on:
      - postgres-dev
    build:
      context: ./
      dockerfile: Dockerfile.dev
    ports:
      - "9999:9999"
      - "9100:9100"
    environment:
      - GOTRUE_DB_MIGRATIONS_PATH=/app/migrations
    volumes:
      - ./:/app:Z
    command: CompileDaemon --build="make build" --directory=/app --recursive=true -pattern="(.+\.go|.+\.env)" -exclude=back -exclude=back-arm64 -exclude=.env --command="/app/back -c=.env.docker"
  postgres-dev:
    build:
      context: .
      dockerfile: Dockerfile.postgres.dev
    container_name: back_postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=postgres
      # sets the schema name, this should match the `NAMESPACE` env var set in your .env file
      - DB_NAMESPACE=back
  pgadmin-dev:
    container_name: back_pgadmin_dev
    depends_on:
      - postgres-dev
    image: dpage/pgadmin4
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@provider.com
      PGADMIN_DEFAULT_PASSWORD: admin
volumes:
  postgres_data_dev:
